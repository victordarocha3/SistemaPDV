version: '3.8'

services:
  postgres-pdv:
    image: postgres:15
    container_name: postgres-pdv
    environment:
      POSTGRES_DB: pdv_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_pdv_data:/var/lib/postgresql/data

volumes:
  postgres_pdv_data: